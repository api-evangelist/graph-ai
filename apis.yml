name: Graph AI
description: 'Graph AI is an AI-native software company (founded 2024, CEO Raghavendra
  Parvataraju) building Graph Safety Suite, a unified platform for pharmacovigilance
  and drug safety in life sciences. Powered by its agentic graphx foundation and built
  on Google Cloud (Vertex AI, Kubernetes), the suite unifies source intake, case processing,
  aggregate reporting, signal detection, risk management and regulatory compliance
  into one connected ecosystem via modules including /intake, /nucleus, /report, /signal,
  /assure and /comply. Available on Google Cloud Marketplace, the company raised a
  $3M seed round led by Bessemer Venture Partners in October 2025. Graph AI is in the
  API Evangelist network as a company profile; it publishes no public developer API,
  OpenAPI, SDK or documentation surface at this time.'
